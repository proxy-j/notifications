<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Notifications</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #222; color: #fff; }
        input { padding: 10px; font-size: 16px; width: 300px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00d26a; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Global Notification System</h2>
    <p>Open this page in two different tabs or browsers to test!</p>
    
    <button onclick="enableNotifications()" id="permBtn">1. Click to Enable Notifications</button>
    <br><br>
    
    <div>
        <input id="input" autocomplete="off" placeholder="Type a message to everyone..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();

        // 1. Request Permission
        function enableNotifications() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notification");
            } else {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById('permBtn').style.display = 'none'; // Hide button if granted
                        alert("Notifications enabled! Waiting for messages...");
                    }
                });
            }
        }

        // 2. Send Message to Server
        function sendMessage() {
            var input = document.getElementById('input');
            if (input.value) {
                // Send the message to the server
                socket.emit('chat message', input.value); 
                input.value = ''; // Clear box
            }
        }

        // 3. Receive Message from Server
        socket.on('chat message', function(msg) {
            // Trigger the native web notification
            if (Notification.permission === "granted") {
                new Notification("New Message!", {
                    body: msg,
                    icon: "https://cdn-icons-png.flaticon.com/512/2550/2550209.png"
                });
            }
        });
    </script>
</body>
</html>
